<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#101927">
  <meta name="description" content="一个纯属虚构的政治修辞称号随机生成器。自由组合时代背景、形容词、概念和称号。">
  <title>称号制造局 · 虚构称号生成器</title>
  <style>
    :root{color-scheme:dark;--bg:#0e1725;--panel:#152235;--panel2:#1b2a3e;--line:#35465c;--ink:#f5f1e8;--muted:#aab8c8;--accent:#e9a568;--accent2:#f4c494;--green:#83b7a6;--shadow:0 26px 70px rgba(0,0,0,.25)}
    *{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:radial-gradient(circle at 82% 12%,#26364c 0,transparent 34%),radial-gradient(circle at 5% 80%,#1b2c3d 0,transparent 30%),var(--bg);color:var(--ink);font:16px/1.65 "Noto Sans SC","Microsoft YaHei",system-ui,sans-serif;min-height:100vh}button{font:inherit;cursor:pointer}button:focus-visible,input:focus-visible{outline:3px solid var(--accent2);outline-offset:3px}.shell{max-width:1120px;margin:auto;padding:24px 24px 64px}.top{display:flex;align-items:center;justify-content:space-between;gap:18px;border-bottom:1px solid var(--line);padding-bottom:18px}.brand{font-weight:900;letter-spacing:.08em;font-size:1.05rem}.brand-mark{display:inline-grid;place-items:center;width:33px;height:33px;border:1px solid var(--accent);color:var(--accent);margin-right:11px;font-family:serif}.top-note{color:var(--muted);font-size:.88rem}.hero{display:grid;grid-template-columns:minmax(0,1fr) 270px;align-items:center;gap:45px;padding:62px 0 48px}.eyebrow{color:var(--accent);font-size:.85rem;font-weight:800;letter-spacing:.16em}.hero h1{font-size:clamp(2.8rem,6vw,5.2rem);line-height:1.15;letter-spacing:-.055em;margin:15px 0 22px;font-family:"Noto Serif SC","SimSun",serif}.hero h1 em{font-style:normal;color:var(--accent2)}.hero p{color:#c0cbd7;max-width:650px;font-size:1.06rem;margin:0}.seal{width:230px;height:230px;display:grid;place-items:center;justify-self:center;border:2px solid rgba(233,165,104,.65);border-radius:50%;position:relative;transform:rotate(-10deg);box-shadow:inset 0 0 0 8px var(--bg),inset 0 0 0 9px rgba(233,165,104,.36)}.seal:before,.seal:after{content:"✦";position:absolute;color:var(--accent);font-size:1.2rem;left:50%;transform:translateX(-50%)}.seal:before{top:12px}.seal:after{bottom:12px}.seal span{color:var(--accent2);font-family:"Noto Serif SC","SimSun",serif;font-size:2rem;line-height:1.4;text-align:center;font-weight:800;letter-spacing:.16em}.layout{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(290px,.85fr);gap:20px;align-items:start}.panel{background:linear-gradient(145deg,rgba(29,44,64,.98),rgba(18,31,48,.98));border:1px solid var(--line);border-radius:18px;box-shadow:var(--shadow)}.machine{padding:30px}.panel-head{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:24px}.panel-head h2,.settings h2,.results h2{font-size:1rem;margin:0;letter-spacing:.08em}.badge{color:var(--green);background:rgba(131,183,166,.1);border:1px solid rgba(131,183,166,.25);font-size:.75rem;border-radius:30px;padding:5px 10px}.result-card{background:linear-gradient(150deg,#26354a,#1e2d42 65%,#263449);border:1px solid #536175;border-radius:14px;padding:30px;min-height:230px;display:flex;flex-direction:column;justify-content:space-between;position:relative;overflow:hidden}.result-card:before{content:"“";position:absolute;font:200px/1 Georgia,serif;color:rgba(255,255,255,.045);top:-30px;right:10px}.result-meta{color:var(--accent2);font-size:.8rem;font-weight:700;letter-spacing:.1em}.title-output{position:relative;font-family:"Noto Serif SC","SimSun",serif;font-weight:800;font-size:clamp(1.5rem,3.1vw,2.4rem);line-height:1.55;letter-spacing:.025em;overflow-wrap:anywhere;margin:17px 0}.fake-label{color:#aebccc;font-size:.82rem}.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:20px}.primary,.secondary,.small-button{border-radius:10px;transition:transform .15s,background .15s,border-color .15s}.primary:hover,.secondary:hover,.small-button:hover{transform:translateY(-2px)}.primary{border:1px solid var(--accent);background:var(--accent);color:#172232;font-weight:900;padding:13px 22px}.primary:hover{background:var(--accent2)}.secondary{border:1px solid #53657d;background:#24354b;color:var(--ink);font-weight:700;padding:13px 18px}.secondary:hover{border-color:var(--accent)}.batch-row{display:flex;align-items:center;gap:10px;margin-top:24px;flex-wrap:wrap}.batch-row .label{color:var(--muted);font-size:.88rem;margin-right:4px}.pill{border:1px solid #53657d;background:transparent;color:var(--muted);border-radius:999px;padding:6px 14px;min-width:43px}.pill.active{background:var(--accent);border-color:var(--accent);color:#142032;font-weight:800}.batch-button{margin-left:auto}.settings{padding:28px}.settings p{color:var(--muted);font-size:.88rem;margin:5px 0 19px}.category-list{display:grid;gap:10px}.category{display:flex;align-items:center;gap:10px;background:#213248;border:1px solid #40536c;border-radius:10px;padding:11px 13px;cursor:pointer;font-size:.92rem}.category input{accent-color:var(--accent);width:18px;height:18px;margin:0}.category small{margin-left:auto;color:#a1afc0;font-size:.76rem}.settings-rule{border:0;border-top:1px solid var(--line);margin:22px 0}.toggle-line{display:flex;justify-content:space-between;align-items:center;gap:10px;cursor:pointer}.toggle-line strong{font-size:.92rem}.toggle-line small{display:block;color:var(--muted);font-size:.78rem;font-weight:400}.switch{position:relative;width:45px;height:26px;flex:none}.switch input{position:absolute;opacity:0;inset:0;width:100%;height:100%;margin:0}.track{display:block;width:100%;height:100%;background:#536275;border-radius:50px;transition:background .2s}.track:after{content:"";position:absolute;width:20px;height:20px;top:3px;left:3px;border-radius:50%;background:white;transition:transform .2s}.switch input:checked+.track{background:#b87649}.switch input:checked+.track:after{transform:translateX(19px)}.switch input:focus-visible+.track{outline:3px solid var(--accent2);outline-offset:3px}.formula{margin-top:20px;padding:23px 27px}.formula-top{font-size:.8rem;color:var(--accent);letter-spacing:.12em;font-weight:800}.formula-line{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin-top:12px}.formula-line span{border:1px solid #47576c;padding:7px 11px;border-radius:7px;background:#213247;font-size:.85rem}.formula-line b{color:var(--accent);font-size:1.2rem}.formula p{font-size:.84rem;color:var(--muted);margin:14px 0 0}.results{margin-top:30px}.results-head{display:flex;justify-content:space-between;gap:15px;align-items:center;margin-bottom:14px}.results h2{font-size:1.12rem}.results-head p{color:var(--muted);font-size:.86rem;margin:4px 0 0}.small-button{background:transparent;color:var(--accent2);border:1px solid #667387;padding:8px 13px;font-size:.84rem;font-weight:700}.results-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.item{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;background:#1b2b3e;border:1px solid #394c62;border-radius:12px;padding:17px 18px}.item h3{font:700 1.08rem/1.6 "Noto Serif SC","SimSun",serif;margin:5px 0 0;overflow-wrap:anywhere}.item .num{font-size:.72rem;color:var(--accent);letter-spacing:.08em}.copy-item{flex:none;background:#2a3b51;color:#e8eef5;border:1px solid #50627a;border-radius:7px;padding:6px 10px;font-size:.78rem}.copy-item:hover{border-color:var(--accent)}.footer{display:flex;justify-content:space-between;gap:15px;border-top:1px solid var(--line);margin-top:46px;padding-top:18px;color:#96a5b6;font-size:.82rem}.toast{position:fixed;bottom:24px;left:50%;transform:translate(-50%,20px);opacity:0;pointer-events:none;background:#ecbb8c;color:#142032;border-radius:9px;padding:10px 16px;font-size:.86rem;font-weight:800;transition:.2s;box-shadow:var(--shadow);z-index:10}.toast.show{opacity:1;transform:translate(-50%,0)}@media(max-width:800px){.hero{grid-template-columns:1fr;padding:44px 0 30px}.seal{display:none}.layout{grid-template-columns:1fr}.settings{order:2}.formula{margin-top:20px}}@media(max-width:600px){.shell{padding:18px 15px 45px}.top-note{display:none}.hero h1{font-size:3rem}.machine,.settings{padding:20px}.result-card{padding:23px;min-height:220px}.results-grid{grid-template-columns:1fr}.batch-button{margin-left:0}.footer{display:block}.footer span{display:block;margin-bottom:5px}}@media(prefers-reduced-motion:reduce){*,*:before,*:after{scroll-behavior:auto!important;transition:none!important}}
  </style>
  <style>
    :root{color-scheme:light;--bg:#fff;--panel:#fff;--panel2:#f5f8fc;--line:#dce4ec;--ink:#182638;--muted:#617184;--accent:#215ca5;--accent2:#174d8c;--green:#18865d;--shadow:0 12px 36px rgba(29,52,82,.07)}
    body{background:#fff;color:var(--ink)}
    .shell{max-width:1100px;padding-top:42px}
    .hero{display:block;padding:12px 0 34px}
    .hero h1{font-family:"Noto Serif SC","SimSun",serif;font-size:clamp(2.25rem,4.7vw,3.55rem);letter-spacing:-.035em;line-height:1.25;margin:0;color:#172c49}
    .panel{background:#fff;border-color:#dce4ec;box-shadow:var(--shadow)}
    .machine,.settings{background:#fff}
    .panel-head h2,.settings h2,.results h2{color:#253a52}
    .badge{display:inline-flex;align-items:center;gap:10px;padding:6px 12px 6px 8px;font-size:.88rem;font-weight:800;letter-spacing:.02em;border-radius:999px}
    .rarity-icon{display:grid;place-items:center;width:31px;height:31px;flex:none;border-radius:50%;font-size:1.35rem;line-height:1;color:#fff}
    .rarity-legendary{color:#946d0b;background:#fff8dd;border:1px solid #f0db90}.rarity-legendary .rarity-icon{background:#d4a527}
    .rarity-epic{color:#6a39aa;background:#f3edfc;border:1px solid #dbc9f2}.rarity-epic .rarity-icon{background:#874fc4}
    .rarity-rare{color:#11764f;background:#eaf7f0;border:1px solid #bbe3ca}.rarity-rare .rarity-icon{background:#179360}
    #generate{display:inline-flex;align-items:center;justify-content:center;gap:9px}
    #generate svg{width:19px;height:19px;flex:none}
    .result-card{background:linear-gradient(145deg,#f8fbff,#eff5fb);border-color:#d5e1ed;min-height:208px;box-shadow:none}
    .result-card:before{color:rgba(38,91,152,.065)}
    .result-meta{color:#50749c}.title-output{color:#193453}.fake-label{color:#62758a}
    .primary{background:#205da5;border-color:#205da5;color:#fff}.primary:hover{background:#174b89}
    .secondary{background:#fff;border-color:#c3d1df;color:#284767}.secondary:hover{background:#f3f7fb;border-color:#7ea4cb}
    .batch-row .label,.settings p,.toggle-line small,.results-head p,.formula p{color:#617184}
    .pill{border-color:#c9d5e1;color:#45617d;background:#fff}.pill.active{background:#dcecff;border-color:#7cacdf;color:#164d89}
    .category{background:#f7f9fc;border-color:#dce4ec;color:#263d56}.category small{color:#6d7e8f}.category input{accent-color:#2566ad}
    .settings-rule{border-top-color:#dce4ec}.track{background:#c1ccd8}.switch input:checked+.track{background:#286bb2}
    .item{background:#fff;border-color:#dce4ec}.item h3{color:#223a56}.item .num{color:#52769d}.copy-item{background:#f6f9fc;color:#27527d;border-color:#cbd9e6}.copy-item:hover{border-color:#7ba6d1}
    .footer{border-top-color:#e2e8ef;color:#687b8d}.toast{background:#203c5d;color:#fff}
    @media(max-width:800px){.hero{padding:8px 0 26px}}
  </style>
</head>
<body>
<div class="shell">
  <section class="hero" aria-labelledby="main-title"><h1 id="main-title">史诗级称号生成器</h1></section>
  <main>
    <div class="layout">
      <section class="panel machine" aria-label="称号生成器"><div class="panel-head"><h2>本次抽取</h2><span class="badge rarity-epic" id="rarity"><span class="rarity-icon" aria-hidden="true">✦</span><span class="rarity-text">史诗 · EPIC</span></span></div><div class="result-card"><div class="result-meta" id="result-number">第 001 次生成</div><div class="title-output" id="title-output" aria-live="polite">中国式现代化进程中有担当的国家改革发展战略家</div><div class="fake-label">虚构戏仿称号 · 非官方头衔或表述</div></div><div class="actions"><button class="primary" id="generate" type="button"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="2.5" y="2.5" width="19" height="19" rx="3"/><circle cx="7.5" cy="7.5" r="1" fill="currentColor" stroke="none"/><circle cx="16.5" cy="7.5" r="1" fill="currentColor" stroke="none"/><circle cx="12" cy="12" r="1" fill="currentColor" stroke="none"/><circle cx="7.5" cy="16.5" r="1" fill="currentColor" stroke="none"/><circle cx="16.5" cy="16.5" r="1" fill="currentColor" stroke="none"/></svg>再摇一个</button><button class="secondary" id="copy-main" type="button">复制称号</button></div><div class="batch-row"><span class="label">一次抽取</span><button class="pill active" type="button" data-count="1" aria-pressed="true">1</button><button class="pill" type="button" data-count="5" aria-pressed="false">5</button><button class="pill" type="button" data-count="10" aria-pressed="false">10</button><button class="secondary batch-button" id="batch" type="button">批量生成</button></div></section>
      <aside class="panel settings" aria-label="生成设置"><h2>词条偏好</h2><p>选择想要抽取的称号类型。</p><div class="category-list"><label class="category"><input type="checkbox" value="strategy" checked><span>战略人物</span><small>战略家 · 总调度员</small></label><label class="category"><input type="checkbox" value="navigation" checked><span>航行与领路</span><small>掌舵人 · 领航员</small></label><label class="category"><input type="checkbox" value="symbols" checked><span>方向与支柱</span><small>指南针 · 压舱石</small></label><label class="category"><input type="checkbox" value="builders" checked><span>建设与开拓</span><small>总设计师 · 奠基人</small></label></div></aside>
    </div>
    <section class="results" aria-labelledby="results-title"><div class="results-head"><div><h2 id="results-title">本轮结果</h2><p id="results-count">生成 1 条 · 点击可单独复制</p></div><button class="small-button" id="copy-all" type="button">复制全部</button></div><div id="results-grid" class="results-grid" aria-live="polite"></div></section>
  </main>
  <footer class="footer"><span>称号制造局 © 戏仿实验</span><span>所有生成结果均为虚构戏仿称号。</span></footer>
</div><div id="toast" class="toast" role="status" aria-live="polite"></div>
<script>
(()=>{
  const contexts=[
    {text:"人类命运共同体建设中",avoid:[]},
    {text:"中国式现代化进程中",avoid:["现代化"]},
    {text:"中华民族伟大复兴征程上",avoid:["民族复兴"]},
    {text:"世界百年未有之大变局中",avoid:[]},
    {text:"新时代中国特色社会主义事业中",avoid:["新时代"]},
    {text:"全面深化改革进程中",avoid:["改革"]},
    {text:"社会主义现代化强国建设中",avoid:["现代化"]}
  ];
  const groups={
    strategy:{adjectives:["有担当","富有远见","善于统筹","高瞻远瞩"],pairs:[["国家改革发展","战略家"],["全球治理","战略家"],["发展大局","总调度员"],["改革发展","总指挥官"],["现代化建设","战略家"]]},
    navigation:{adjectives:["坚定","勇毅","卓越","有担当"],pairs:[["改革航船","掌舵人"],["时代航程","领航员"],["民族复兴","领路人"],["现代化建设","领航者"],["发展航向","领航员"]]},
    symbols:{adjectives:["重要","关键","不可或缺"],pairs:[["改革发展","指南针"],["前进道路","定盘星"],["现代化建设","定星盘"],["发展大局","压舱石"],["民族复兴","主心骨"],["伟大事业","顶梁柱"]]},
    builders:{adjectives:["有担当","富有远见","善于谋划","卓越"],pairs:[["现代化建设","总设计师"],["伟大事业","开拓者"],["民族复兴","奠基人"],["改革开放","开拓者"],["强国建设","总设计师"],["发展新局","开创者"]]}
  };
  const $=id=>document.getElementById(id),choose=a=>a[Math.floor(Math.random()*a.length)];let sequence=1,count=1,current="中国式现代化进程中有担当的国家改革发展战略家",latest=[current],recent=new Set([current]);
  function selected(){return [...document.querySelectorAll('.category input:checked')].map(x=>x.value)}
  function rarity(){const n=Math.random();return n<.08?{name:"传说 · LEGENDARY",className:"rarity-legendary"}:n<.36?{name:"史诗 · EPIC",className:"rarity-epic"}:{name:"稀有 · RARE",className:"rarity-rare"}}
  function makeTitle(active){const data=groups[choose(active)],[concept,role]=choose(data.pairs),matching=contexts.filter(context=>!context.avoid.some(word=>concept.includes(word)));return `${choose(matching).text}${choose(data.adjectives)}的${concept}${role}`}
  function generate(n){const active=selected();if(!active.length){showToast('请至少选择一个词条风格');return}const made=[],seen=new Set();for(let i=0;i<n;i++){let title,tries=0;do{title=makeTitle(active);tries++}while((seen.has(title)||recent.has(title))&&tries<60);made.push(title);seen.add(title);recent.add(title)}if(recent.size>100)recent=new Set(made);latest=made;current=made[0];sequence+=n;$('title-output').textContent=current;$('result-number').textContent=`第 ${String(sequence).padStart(3,'0')} 次生成`;const quality=rarity();$('rarity').className=`badge ${quality.className}`;$('rarity').querySelector('.rarity-text').textContent=quality.name;render()}
  function render(){$('results-count').textContent=`生成 ${latest.length} 条 · 点击可单独复制`;$('results-grid').replaceChildren(...latest.map((title,i)=>{const el=document.createElement('article');el.className='item';const content=document.createElement('div');const num=document.createElement('div');num.className='num';num.textContent=`称号 ${String(i+1).padStart(2,'0')} · 虚构戏仿`;const heading=document.createElement('h3');heading.textContent=title;content.append(num,heading);const btn=document.createElement('button');btn.className='copy-item';btn.type='button';btn.textContent='复制';btn.setAttribute('aria-label',`复制称号：${title}`);btn.addEventListener('click',()=>copy(title));el.append(content,btn);return el}))}
  let toastTimer;function showToast(message){const el=$('toast');el.textContent=message;el.classList.add('show');clearTimeout(toastTimer);toastTimer=setTimeout(()=>el.classList.remove('show'),2300)}
  async function copy(text){try{if(navigator.clipboard&&window.isSecureContext){await navigator.clipboard.writeText(text)}else{const area=document.createElement('textarea');area.value=text;area.style.position='fixed';area.style.opacity='0';document.body.append(area);area.select();if(!document.execCommand('copy'))throw Error('copy failed');area.remove()}showToast('已复制到剪贴板')}catch{showToast('复制失败，请手动选中文字')}}
  $('generate').addEventListener('click',()=>generate(1));$('batch').addEventListener('click',()=>generate(count));$('copy-main').addEventListener('click',()=>copy(current));$('copy-all').addEventListener('click',()=>copy(latest.join('\n')));document.querySelectorAll('[data-count]').forEach(btn=>btn.addEventListener('click',()=>{count=Number(btn.dataset.count);document.querySelectorAll('[data-count]').forEach(b=>{const on=b===btn;b.classList.toggle('active',on);b.setAttribute('aria-pressed',String(on))})}));render();
})();
</script>
</body>
</html>
